server {
    listen 80;
    server_name _;

    # Ocultar versión de nginx en cabeceras de respuesta
    server_tokens off;

    # ── Cabeceras de Seguridad Globales (Hardening) ──────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http: https:; frame-ancestors 'none';" always;

    # ── Let's Encrypt / Certbot Challenge ──────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # ── Frontend React SPA ───────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # React Router HTML5 History Mode
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy hacia la API Spring Boot ───────────────────────────────────────
    # Resolver DNS interno de Docker (127.0.0.11)
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://app:8080;

    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Caché de assets estáticos ────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
