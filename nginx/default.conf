server {
    listen 80;
    server_name _;

    # ── Frontend React SPA ─────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa HTML5 history; cualquier ruta desconocida vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy hacia la API Spring Boot ────────────────────────────────────────
    # El contenedor Spring Boot se llama "app" en la red Docker interna.
    # resolver 127.0.0.11: DNS interno de Docker — permite resolución dinámica
    # del upstream sin que nginx falle al arrancar si "app" aún no está listo.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://app:8080;

    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ── Caché de assets estáticos ──────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Ocultar versión de nginx en cabeceras de error
    server_tokens off;
}
