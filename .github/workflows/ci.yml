name: CI — Build y Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Ejecutar tests de integración (H2)
        run: mvn test --no-transfer-progress

  frontend-build:
    name: Frontend (Node 20 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar build de producción
        working-directory: frontend
        run: npm run build

      - name: Lint
        working-directory: frontend
        run: npm run lint
