version: '3.8'

# ── Arquitectura de Producción Hetzner BlueDeploy ────────────────────────────
#   · MariaDB 11 en red interna blue-net aislada (puerto 3306 no expuesto)
#   · Backend Spring Boot en red interna (puerto 8080 no expuesto)
#   · Nginx como único reverse proxy frontal en puertos 80 y 443
#   · Gestión de secretos mediante variables de entorno .env
#   · Healthchecks activos para orquestación ordenada

networks:
  blue-net:
    driver: bridge

volumes:
  db_data:
  certbot_www:
  certbot_conf:

services:

  # ── Base de datos MariaDB ──────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: blue-db
    restart: unless-stopped
    networks:
      - blue-net
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Backend Spring Boot 3 / Java 21 ────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blue-app
    restart: unless-stopped
    networks:
      - blue-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      BLUEDEPLOY_API_KEY: ${BLUEDEPLOY_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/checks/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ── Frontend React + Nginx Reverse Proxy ───────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: blue-frontend
    restart: unless-stopped
    networks:
      - blue-net
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
