version: '3.8'

services:
  db:
    image: mariadb:11
    container_name: blue-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: blue-app
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-bluedeploy}
      DB_USER: ${DB_USER:-bluedeploy}
      DB_PASSWORD: ${DB_PASSWORD:-bluedeploy}
      BLUEDEPLOY_API_KEY: ${BLUEDEPLOY_API_KEY:-bluedeploy-secret-key-change-in-prod}

volumes:
  db_data:

